<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARIS | Marine Intelligence</title><script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/recharts@2.15.4/umd/Recharts.js"></script><link rel="stylesheet" href="style.css"></head>
<body><div id="root"></div><script>
const {useState}=React;const {ResponsiveContainer,BarChart,Bar,XAxis,YAxis,CartesianGrid,Tooltip,ScatterChart,Scatter,ZAxis}=Recharts;
const C=[
["CAND-01",50737,-20.396344,57.682401,938.84,981.28],["CAND-02",25193,-20.349996,57.744018,540.06,924.65],
["CAND-03",5721,-20.375006,57.683523,632.61,1233.53],["CAND-04",3510,-20.392103,57.678893,892.19,1196.18],
["CAND-05",3396,-20.413374,57.781359,852.51,686.40],["CAND-06",1910,-20.355482,57.747117,629.83,769],
["CAND-07",1393,-20.354786,57.738334,655.59,1079.02],["CAND-08",1284,-20.379224,57.685685,691.16,1080.23],
["CAND-09",1040,-20.355263,57.743942,638.90,880.04],["CAND-10",542,-20.387942,57.678950,832.86,1238.23]]
.map(x=>({id:x[0],area:x[1],lat:x[2],lon:x[3],row:x[4],col:x[5]}));
const V=[["MT ELISE","645357000","0.142","0.37","MUS"],["BOKA EXPEDITION","215337000","0.342","0.37","MLT"],["FIB X10","645465000","0.187","4.37","MUS"],["TRESTA STAR","645527000","1.184","0.37","MUS"],["STANFORD HAWK","376955000","1.344","0.37","VCT"],["BOKA SUMMIT","248972000","1.344","0.37","MLT"]].map(x=>({name:x[0],mmsi:x[1],distance:+x[2],time:+x[3],flag:x[4]}));
function App(){const [page,setPage]=useState("Home"),[sel,setSel]=useState(C[0]),[file,setFile]=useState(null),[img,setImg]=useState(""),[running,setRunning]=useState(false),[result,setResult]=useState(null),[alert,setAlert]=useState(true);
const nav=[["Home","⌂"],["Analyze","◉"],["Intelligence","◈"],["Reports","▤"]];
function upload(e){let f=e.target.files[0];if(!f)return;setFile(f);let r=new FileReader();r.onload=x=>setImg(x.target.result);r.readAsDataURL(f)}
function run(){if(!file)return;setRunning(true);setTimeout(()=>{setRunning(false);setResult({label:"OIL SPILL",confidence:99.96})},1000)}
return <div className="shell"><aside><div className="logo"><b>MARIS</b><small>Marine Intelligence</small></div>{nav.map(n=><button className={page===n[0]?"nav on":"nav"} onClick={()=>setPage(n[0])}><i>{n[1]}</i>{n[0]}</button>)}<div className="sidefoot"><span>●</span> AI ENGINE ONLINE<br/><small>Sentinel-1B · Case study</small></div></aside>
<main><header><div><small>MARINE OIL-SPILL INTELLIGENCE</small><h1>{page}</h1></div><div className="topstatus">● SYSTEM READY</div></header>
{page==="Home"&&<Home setPage={setPage} alert={alert}/>}
{page==="Analyze"&&<Analyze file={file} img={img} upload={upload} run={run} running={running} result={result}/>}
{page==="Intelligence"&&<Intel sel={sel} setSel={setSel}/>}
{page==="Reports"&&<Reports/>}
</main></div>}
function Home({setPage,alert}){return <section>
{alert&&<div className="alert"><b>⚠ POTENTIAL SPILL FEATURES DETECTED</b><span>10 SAR candidate regions require validation.</span><button onClick={()=>setPage("Intelligence")}>INVESTIGATE →</button></div>}
<div className="hero"><div><small>MARIS DETECTION ENGINE</small><h2>From image to<br/><em>marine intelligence.</em></h2><p>Upload an image, inspect candidate spill regions, correlate vessel activity and review explainable evidence in one workspace.</p><button className="primary" onClick={()=>setPage("Analyze")}>START ANALYSIS →</button></div><div className="heroScore"><small>MODEL TEST ACCURACY</small><strong>88.17<sup>%</sup></strong><span>MobileNetV2 classifier</span><div><b>95%</b> oil precision &nbsp; <b>80%</b> oil recall</div></div></div>
<div className="cards"><Card n="10" t="SAR candidates" s="detected regions"/><Card n="2.62%" t="Candidate coverage" s="cleaned mask"/><Card n="7" t="AIS identities" s="analysis region"/><Card n="35" t="Evidence profiles" s="vessel × candidate"/></div>
<div className="grid2"><div className="panel"><small>LIVE CASE VIEW</small><h3>Candidate spill distribution</h3><Plot/></div><div className="panel"><small>RESPONSE STATUS</small><h3>MARIS pipeline</h3><div className="steps">{["Satellite scene","Dark-region detection","Candidate extraction","Geolocation","AIS correlation","Evidence review"].map((x,i)=><div><b>{i+1}</b><span>{x}</span><i>READY</i></div>)}</div></div></div>
</section>}
function Card({n,t,s}){return <div className="card"><strong>{n}</strong><b>{t}</b><small>{s}</small></div>}
function Analyze({file,img,upload,run,running,result}){return <section><div className="intro"><small>PRIMARY WORKFLOW</small><h2>Upload an image. Let MARIS investigate.</h2><p>The uploaded image is processed by the current image-classification model. Compatible images receive an oil/no-oil result.</p></div><div className="analyze"><div className="panel"><label className="drop">{img?<img src={img}/>:<><strong>＋</strong><b>Drop satellite image here</b><span>JPG or PNG · click to browse</span></>}<input type="file" accept="image/*" onChange={upload}/></label>{file&&<div className="file">✓ {file.name}<span>{(file.size/1024).toFixed(0)} KB</span></div>}<button disabled={!file||running} className="primary wide" onClick={run}>{running?"ANALYZING...":"RUN MARIS ANALYSIS →"}</button></div><div className={"panel result "+(result?"hot":"")}>{!result&&!running&&<><div className="target">◎</div><b>Awaiting analysis</b><small>Upload an image to begin.</small></>}{running&&<><div className="spinner"></div><b>MARIS is analyzing</b><small>Preprocessing · inference · result</small></>}{result&&<><small>CLASSIFICATION RESULT</small><h2>OIL SPILL</h2><div className="confidence">{result.confidence}<sup>%</sup></div><b>Confidence</b><p>This is an image-classification result. It does not by itself geolocate a spill or establish vessel causation.</p></>}</div></div><div className="model"><b>MODEL PERFORMANCE</b><span>Accuracy <strong>88.17%</strong></span><span>Oil precision <strong>95%</strong></span><span>Oil recall <strong>80%</strong></span><span>Oil F1 <strong>87%</strong></span></div></section>}
function Intel({sel,setSel}){return <section><div className="intro"><small>SATELLITE + AIS + EVIDENCE</small><h2>See where the signal is — and what surrounds it.</h2><p>Click any candidate on the scene. Then inspect its SAR properties and vessel associations.</p></div><div className="intelgrid"><div className="panel scene"><div className="scenehead"><b>SENTINEL-1 VV · CANDIDATE OVERLAY</b><span>10 REGIONS</span></div><div className="image"><img src="../results/wakashio_crop/wakashio_vv_view.png"/>{C.map((c,i)=><button className={sel.id===c.id?"pin chosen":"pin"} style={{left:(c.col/2000*100)+"%",top:(c.row/2000*100)+"%"}} onClick={()=>setSel(c)}>{i+1}</button>)}</div><small>Click a numbered region to inspect it.</small></div><div className="panel details"><small>SELECTED CANDIDATE</small><h2>{sel.id}</h2><strong>{sel.lat.toFixed(6)}° · {sel.lon.toFixed(6)}°</strong><div className="facts"><Fact t="Area" v={sel.area.toLocaleString()+" px"}/><Fact t="Rank" v={"#"+(C.indexOf(sel)+1)}/><Fact t="Mean VV" v="-24.96 dB"/><Fact t="Mean VH" v="-34.35 dB"/></div><div className="notice">Dark SAR backscatter is a candidate feature, not proof of oil. Environmental and multi-temporal validation is required.</div></div></div>
<div className="grid2"><div className="panel"><small>REGION SIZE</small><h3>Detected candidate areas</h3><div className="chart"><ResponsiveContainer><BarChart data={C}><CartesianGrid strokeDasharray="3 3"/><XAxis dataKey="id"/><YAxis/><Tooltip/><Bar dataKey="area" fill="#f16b58"/></BarChart></ResponsiveContainer></div></div><div className="panel"><small>AIS CORRELATION</small><h3>Nearby vessel context</h3><div className="vlist">{V.map(v=><div><span>◇</span><b>{v.name}<small>{v.mmsi} · {v.flag}</small></b><strong>{v.distance} km</strong></div>)}</div><div className="notice">AIS proximity represents contextual spatial and temporal evidence only. It does not establish that a vessel caused the detected feature.</div></div></div></section>}
function Fact({t,v}){return <div><small>{t}</small><b>{v}</b></div>}
function Plot(){return <div className="plot"><ResponsiveContainer><ScatterChart><CartesianGrid/><XAxis type="number" dataKey="lon" domain={[57.67,57.79]}/><YAxis type="number" dataKey="lat" domain={[-20.43,-20.33]}/><ZAxis dataKey="area" range={[50,250]}/><Tooltip/><Scatter data={C} fill="#f16b58"/></ScatterChart></ResponsiveContainer></div>}
function Reports(){return <section><div className="intro"><small>CASE OUTPUTS</small><h2>Evidence & reports</h2><p>Your backend outputs stay visible and organized for the final demonstration.</p></div><div className="reportgrid">{["maris_candidate_evidence.csv","maris_unique_vessel_candidate_evidence.csv","maris_evidence_profile.csv","ais_presence.csv","ais_vessel_identity.csv"].map(f=><div className="report"><b>▤</b><span>{f}<small>Generated backend evidence</small></span><button onClick={()=>alert("File location: results/wakashio_detection/"+f)}>VIEW LOCATION</button></div>)}</div><div className="panel disclaimer"><h3>Evidence interpretation</h3><p>AIS proximity represents contextual spatial and temporal evidence only. It does not establish that a vessel caused the detected feature. MARIS preserves uncertainty and multiple plausible associations.</p></div></section>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
